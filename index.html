<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: wajib supaya env(safe-area-inset-*) terisi di iPhone
         berponi; dipakai bottom-nav & modal agar tidak tertimpa home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3d6314" />
    <!-- iOS: "Add to Home Screen" jalan standalone (tanpa address bar Safari).
         status-bar-style sengaja "default" (bukan black-translucent) supaya iOS
         tetap memesan ruang status bar & judul halaman tidak tertutup poni. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kasir Sparepart" />
    <title>Kasir Sparepart</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
