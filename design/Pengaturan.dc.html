<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; }
body { margin: 0; }
.root {
  width: 1440px; height: 900px; display: flex;
  background: #57735F; font-family: 'Work Sans', system-ui, sans-serif;
  color: #202A22;
}
.sidebar {
  width: 120px; flex-shrink: 0; background: #3F5B49; display: flex;
  flex-direction: column; align-items: center; padding: 28px 0;
}
.logo-badge {
  width: 44px; height: 44px; border-radius: 12px; background: #E4A24A; color: #241400;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.15rem; margin-bottom: 30px;
}
.nav-list { display: flex; flex-direction: column; gap: 8px; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 6px; border-radius: 12px; width: 92px;
  color: rgba(245,247,242,.62);
}
.nav-item span { font-size: .66rem; font-weight: 500; text-align: center; line-height: 1.2; }
.nav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.nav-item.active { background: rgba(255,255,255,.13); color: #F5F7F2; }
.nav-item.active svg { stroke: #E4A24A; }

.main { flex: 1; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px; min-width: 0; align-items: flex-start; }
.page-head h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.62rem; color: #F5F7F2; margin: 0 0 4px; letter-spacing: -.005em; }
.page-head .sub { font-size: .87rem; color: rgba(245,247,242,.66); margin: 0; }

.menu-list { display: flex; flex-direction: column; gap: 14px; width: 460px; }
.menu-row { display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 18px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(20,26,18,.06), 0 10px 26px rgba(20,26,18,.12); }
.menu-row .icon-wrap { width: 44px; height: 44px; border-radius: 12px; background: #F5F6F1; display: flex; align-items: center; justify-content: center; color: #3F5B49; flex-shrink: 0; }
.menu-row .icon-wrap svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.menu-row .text { flex: 1; }
.menu-row .title { font-weight: 600; font-size: .92rem; margin: 0 0 3px; }
.menu-row .sub { font-size: .78rem; color: #5B665C; margin: 0; }
.menu-row .chev { width: 16px; height: 16px; stroke: #5B665C; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
</style>
</helmet>

<div class="root">
  <div class="sidebar">
    <div class="logo-badge">T</div>
    <div class="nav-list">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
        <span>Transaksi</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z"/><path d="M3 7.5 12 12l9-4.5"/><path d="M12 12v9"/></svg>
        <span>Produk</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/><path d="M3 20h18"/></svg>
        <span>Laporan</span>
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="1.8"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="1.8"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="1.8"/></svg>
        <span>Pengaturan</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="page-head">
      <h1>Pengaturan Toko</h1>
      <p class="sub">Pilih menu untuk mengatur masing-masing bagian.</p>
    </div>

    <div class="menu-list">
      <div class="menu-row">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M4 9v11h16V9"/><path d="M3 9l2-5h14l2 5"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/></svg>
        </div>
        <div class="text">
          <p class="title">Identitas Toko</p>
          <p class="sub">Nama &amp; logo yang dicetak di struk</p>
        </div>
        <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div class="menu-row">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M6 9V4h12v5"/><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M6 16v4h12v-4"/></svg>
        </div>
        <div class="text">
          <p class="title">Printer Struk &amp; Laci Kas</p>
          <p class="sub">Koneksi printer, lebar kertas, buka laci</p>
        </div>
        <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
