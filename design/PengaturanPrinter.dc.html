<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; }
body { margin: 0; }
.root {
  width: 1440px; height: 900px; display: flex;
  background: #57735F; font-family: 'Work Sans', system-ui, sans-serif;
  color: #202A22;
}
.sidebar {
  width: 120px; flex-shrink: 0; background: #3F5B49; display: flex;
  flex-direction: column; align-items: center; padding: 28px 0;
}
.logo-badge {
  width: 44px; height: 44px; border-radius: 12px; background: #E4A24A; color: #241400;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.15rem; margin-bottom: 30px;
}
.nav-list { display: flex; flex-direction: column; gap: 8px; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 6px; border-radius: 12px; width: 92px;
  color: rgba(245,247,242,.62);
}
.nav-item span { font-size: .66rem; font-weight: 500; text-align: center; line-height: 1.2; }
.nav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.nav-item.active { background: rgba(255,255,255,.13); color: #F5F7F2; }
.nav-item.active svg { stroke: #E4A24A; }

.main { flex: 1; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px; min-width: 0; align-items: flex-start; }
.back-link { display: flex; align-items: center; gap: 6px; color: rgba(245,247,242,.68); font-size: .8rem; font-weight: 500; margin-bottom: 12px; }
.back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.page-head h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.62rem; color: #F5F7F2; margin: 0 0 4px; letter-spacing: -.005em; }
.page-head .sub { font-size: .87rem; color: rgba(245,247,242,.66); margin: 0; }

.card { background: #FFFFFF; border-radius: 20px; padding: 32px; width: 460px; box-shadow: 0 1px 2px rgba(20,26,18,.06), 0 14px 34px rgba(20,26,18,.12); display: flex; flex-direction: column; gap: 24px; }

.form-field label { display: block; font-family: 'Work Sans', sans-serif; font-size: .78rem; font-weight: 600; color: #5B665C; margin-bottom: 8px; }

.conn-toggle { display: flex; gap: 8px; }
.conn-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px; border-radius: 10px; font-weight: 600; font-size: .82rem; border: 1.5px solid rgba(32,42,34,.14); color: #5B665C; }
.conn-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.conn-btn.selected { background: #3F5B49; border-color: #3F5B49; color: #fff; }

.status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.status-left { display: flex; align-items: center; gap: 9px; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: #3F5B49; flex-shrink: 0; }
.status-text { font-size: .84rem; color: #5B665C; }
.status-text b { font-weight: 600; color: #202A22; }
.btn-outline-sm { background: none; border: 1.5px solid rgba(32,42,34,.16); color: #202A22; border-radius: 999px; padding: 8px 14px; font-weight: 500; font-size: .76rem; white-space: nowrap; }

.chip-row { display: flex; gap: 8px; }
.paper-chip { padding: 8px 16px; border-radius: 999px; border: 1.5px solid rgba(32,42,34,.14); font-size: .8rem; font-weight: 500; color: #5B665C; }
.paper-chip.active { background: #E4A24A; border-color: #E4A24A; color: #241400; }

.test-row { display: flex; gap: 10px; }
.btn-outline-flex { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: none; border: 1.5px solid rgba(32,42,34,.16); color: #202A22; border-radius: 12px; padding: 12px; font-weight: 600; font-size: .82rem; }
.btn-outline-flex svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</helmet>

<div class="root">
  <div class="sidebar">
    <div class="logo-badge">T</div>
    <div class="nav-list">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
        <span>Transaksi</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z"/><path d="M3 7.5 12 12l9-4.5"/><path d="M12 12v9"/></svg>
        <span>Produk</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/><path d="M3 20h18"/></svg>
        <span>Laporan</span>
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="1.8"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="1.8"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="1.8"/></svg>
        <span>Pengaturan</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="page-head">
      <div class="back-link"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Pengaturan</div>
      <h1>Printer Struk &amp; Laci Kas</h1>
      <p class="sub">Koneksi printer, lebar kertas, dan tes buka laci kas.</p>
    </div>

    <div class="card">
      <div class="conn-toggle">
        <div class="conn-btn selected">
          <svg viewBox="0 0 24 24"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
          Bluetooth
        </div>
        <div class="conn-btn">
          <svg viewBox="0 0 24 24"><path d="M12 2v8"/><path d="M8.5 5.5 12 2l3.5 3.5"/><path d="M12 10a5 5 0 0 0-5 5v2a5 5 0 0 0 3 4.6"/><path d="M12 10a5 5 0 0 1 5 5v2a5 5 0 0 1-3 4.6"/><circle cx="8" cy="20.5" r="1.3"/><circle cx="16" cy="20.5" r="1.3"/></svg>
          USB
        </div>
      </div>
      <div class="status-row">
        <div class="status-left">
          <span class="status-dot"></span>
          <span class="status-text">Terhubung &mdash; <b>POS-58 Thermal Printer</b></span>
        </div>
        <button class="btn-outline-sm">Putuskan</button>
      </div>
      <div class="form-field">
        <label>Lebar Kertas</label>
        <div class="chip-row">
          <div class="paper-chip active">58mm</div>
          <div class="paper-chip">80mm</div>
        </div>
      </div>
      <div class="test-row">
        <button class="btn-outline-flex">
          <svg viewBox="0 0 24 24"><path d="M6 9V4h12v5"/><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M6 16v4h12v-4"/></svg>
          Tes Cetak
        </button>
        <button class="btn-outline-flex">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="10" width="17" height="9" rx="1.5"/><path d="M3.5 10 6 4h12l2.5 6"/><line x1="10" y1="14.5" x2="14" y2="14.5"/></svg>
          Buka Laci Kas
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
